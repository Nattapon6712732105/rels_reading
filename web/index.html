<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rel's Reading - คลังนิยายแฟนตาซี ผจญภัย และโลกเวทมนตร์ พร้อมระบบอ่านนิยายและคอมมูนิตี้สำหรับทุกคน">
  <meta name="theme-color" content="#0E0F14">
  <meta name="google-signin-client_id" content="267211717334-bg6su72vc71oaaenjspuhtoq5gmfdrf6.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Open Graph & Social Cards -->
  <meta property="og:title" content="Rel's Reading - Explore Magical Worlds">
  <meta property="og:description" content="Rel's Reading - คลังนิยายแฟนตาซี ผจญภัย และโลกเวทมนตร์ที่คุณชื่นชอบ">
  <meta property="og:image" content="favicon.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Rel's Reading - Explore Magical Worlds">
  <meta name="twitter:description" content="Rel's Reading - คลังนิยายแฟนตาซี ผจญภัย และโลกเวทมนตร์ที่คุณชื่นชอบ">
  <meta name="twitter:image" content="favicon.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rel's Reading">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rel's Reading - Explore Magical Worlds</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0E0F14;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.4s ease-out;
    }
    #loading-splash img {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      box-shadow: 0 0 35px rgba(67, 223, 255, 0.35), 0 0 15px rgba(255, 160, 0, 0.2);
      animation: pulse-glow 2s infinite ease-in-out;
    }
    .loading-bar {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .loading-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 50%;
      background: linear-gradient(90deg, #43DFFF, #FFA000);
      border-radius: 2px;
      animation: loading-slide 1.5s infinite ease-in-out;
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(67, 223, 255, 0.4)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(67, 223, 255, 0.7)); }
    }
    @keyframes loading-slide {
      0% { left: -50%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <img src="favicon.png" alt="Rel's Reading Logo" />
    <div class="loading-bar"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
